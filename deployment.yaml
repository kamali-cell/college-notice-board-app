apiVersion: apps/v1
kind: Deployment
metadata:
  name: noticeboard-deployment
  labels:
    app: noticeboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noticeboard
  template:
    metadata:
      labels:
        app: noticeboard
    spec:
      containers:
      - name: noticeboard-container
        image: YOUR_DOCKERHUB_USERNAME/noticeboard:latest
        ports:
        - containerPort: 80
